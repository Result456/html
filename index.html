<body>
  <div class="container">

    <header>
      <button class="close-btn" onclick="clearForm()"
        aria-label="Clear form">&times;</button>
      <h1>New post</h1>
    </header>

    <main>
      <div class="success" id="success" role="status"></div>
      <p class="error" id="error" role="alert"></p>

      <form id="postForm">

        <div class="field">
          <label>Type</label>

          <div class="types">
            <button type="button" class="type-btn active"
              data-type="Event">Event</button>

            <button type="button" class="type-btn"
              data-type="Announcement">Announcement</button>

            <button type="button" class="type-btn"
              data-type="Service">Service</button>

            <button type="button" class="type-btn"
              data-type="Fundraiser">Fundraiser</button>
          </div>
        </div>

        <div class="field">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            maxlength="150"
            placeholder="What's happening?"
            required
          >
        </div>

        <div class="field">
          <label for="body">Details</label>
          <textarea
            id="body"
            name="body"
            maxlength="5000"
            placeholder="Share the details with your community"
            required
          ></textarea>
        </div>

        <div class="field" id="dateField">
          <label for="eventDate">Date (optional)</label>
          <input
            id="eventDate"
            name="eventDate"
            type="date"
          >
          <p class="hint">Choose the date of your community event.</p>
        </div>

        <button type="submit" hidden></button>
      </form>
    </main>

    <div class="footer">
      <button class="publish-btn" id="publishBtn" type="button">
        ➤ Publish post
      </button>
    </div>

  </div>

  <script>
    const form = document.getElementById("postForm");
    const publishBtn = document.getElementById("publishBtn");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");
    const dateField = document.getElementById("dateField");

    let selectedType = "Event";

    // Choose a post type.
    document.querySelectorAll(".type-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".type-btn").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        selectedType = button.dataset.type;

        dateField.style.display =
          selectedType === "Event" ? "block" : "none";

        showError("");
        successBox.style.display = "none";
      });
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = message ? "block" : "none";
    }

    function clearForm() {
      form.reset();
      selectedType = "Event";

      document.querySelectorAll(".type-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.type === "Event"
        );
      });

      dateField.style.display = "block";
      showError("");
      successBox.style.display = "none";
      publishBtn.disabled = false;
      publishBtn.textContent = "➤ Publish post";
    }

    // Publish the post.
    publishBtn.addEventListener("click", async () => {
      showError("");
      successBox.style.display = "none";

      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      const eventDate = document.getElementById("eventDate").value;

      if (!title || !body) {
        showError("Title and details are required.");
        return;
      }

      const post = {
        type: selectedType,
        title: title,
        body: body,
        event_date:
          selectedType === "Event" && eventDate
            ? eventDate
            : null
      };

      publishBtn.disabled = true;
      publishBtn.textContent = "Publishing...";

      try {
        /*
          This demo saves posts in the browser.
          Connect your backend API here for real community posting.
        */
        const savedPosts = JSON.parse(
          localStorage.getItem("campusCartPosts") || "[]"
        );

        savedPosts.push({
          ...post,
          id: Date.now(),
          created_at: new Date().toISOString()
        });

        localStorage.setItem(
          "campusCartPosts",
          JSON.stringify(savedPosts)
        );

        successBox.textContent =
          "Your post has been saved successfully in this browser.";
        successBox.style.display = "block";

        form.reset();
        selectedType = "Event";

        document.querySelectorAll(".type-btn").forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.type === "Event"
          );
        });

        dateField.style.display = "block";

      } catch (error) {
        showError("Unable to save your post. Please try again.");
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = "➤ Publish post";
      }
    });
  </script>
</body>
</html>
